<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Frases Motivacionales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .quote-fade {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }
        .quote-hidden {
            opacity: 0;
            transform: translateY(12px) scale(0.98);
        }
        .quote-visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 text-white flex flex-col items-center justify-between p-4 sm:p-8 relative overflow-x-hidden">

    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 sm:w-96 sm:h-96 bg-pink-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute bottom-1/4 left-1/3 -translate-x-1/2 w-80 h-80 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <main class="w-full max-w-xl my-auto py-8 z-10 flex flex-col items-center">
        <div class="glass-card w-full rounded-3xl p-6 sm:p-10 shadow-2xl mb-8 flex flex-col items-center text-center relative transition-all duration-300">

            <i class="fa-solid font-serif text-3xl sm:text-4xl text-pink-400/50 mb-3">“</i>
            <div id="quote-container" class="quote-fade quote-visible min-h-[110px] flex flex-col items-center justify-center">
                <p id="quote-text" class="text-lg sm:text-2xl font-semibold leading-relaxed text-slate-100">
                    Haz de cada día tu obra maestra.
                </p>
                <p id="quote-author" class="text-sm sm:text-base font-medium text-pink-300 mt-4 tracking-wide">
                    — John Wooden
                </p>
            </div>
        </div>

        <button id="generate-btn" onclick="generateNewQuote()" class="group relative inline-flex items-center justify-center p-0.5 overflow-hidden text-base sm:text-lg font-bold rounded-full group bg-gradient-to-br from-pink-500 via-purple-500 to-indigo-500 hover:from-pink-600 hover:to-indigo-600 text-white shadow-xl hover:shadow-pink-500/25 transition-all duration-300 hover:scale-105 active:scale-95 focus:outline-none">
            <span class="relative px-8 py-4 transition-all ease-in duration-75 bg-slate-950/40 rounded-full group-hover:bg-opacity-0 flex items-center gap-3">
                
                <span>Generar Frase</span>
            </span>
        </button>
    </main>

    <footer class="w-full text-center text-xs text-slate-400 z-10 pb-2">
        <p></p>
    </footer>

            { text: "Caerse siete veces y levantarse ocho.", author: "Proverbio japonés" },
            { text: "No le temas a los cambios lentos, teme solo a quedarte quieto.", author: "Proverbio chino" },
            { text: "Aprender sin pensar es tiempo perdido; pensar sin aprender es peligroso.", author: "Confucio" },
            { text: "Lo único constante es el cambio.", author: "Heráclito" },
            { text: "Nadie se baña dos veces en el mismo río.", author: "Heráclito" },
            { text: "A veces la pregunta es más importante que la respuesta.", author: "Nancy Willard" },

        let currentQuoteIndex = 0;
        function getRandomQuote() {
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * quotes.length);
            } while (newIndex === currentQuoteIndex && quotes.length > 1);
            
            currentQuoteIndex = newIndex;
            return quotes[newIndex];
        }

        function generateNewQuote() {
            const container = document.getElementById('quote-container');
            const textElem = document.getElementById('quote-text');
            const authorElem = document.getElementById('quote-author');

            container.classList.remove('quote-visible');
            container.classList.add('quote-hidden');

            setTimeout(() => {
                const newQuote = getRandomQuote();
                textElem.textContent = newQuote.text;
                authorElem.textContent = `— ${newQuote.author}`;

                container.classList.remove('quote-hidden');
                container.classList.add('quote-visible');
            }, 400);
        }
    </script>
</body>
</html>
